<style>
/* Layout: barra superiore con tab, contenuto a pannelli; stile "cantiere/ufficio tecnico" */
:root{
  --bg:#f3f4f2;--surface:#ffffff;--fg:#1d2321;--muted:#5f6a66;--line:#d9ddd9;
  --accent:#c4421a;--accent-ink:#ffffff;--ok:#2f7d4f;--warn:#b07a12;--off:#8a8f8c;--info:#2a5fa8;
  --f-disp:"Archivo",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151917;--surface:#1e2421;--fg:#e8ece9;--muted:#9aa49f;--line:#323a36;
  --accent:#ef6a3e;--accent-ink:#1a0e08;--ok:#5cc187;--warn:#e0aa3c;--off:#7c8480;--info:#79a7ec;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151917;--surface:#1e2421;--fg:#e8ece9;--muted:#9aa49f;--line:#323a36;
  --accent:#ef6a3e;--accent-ink:#1a0e08;--ok:#5cc187;--warn:#e0aa3c;--off:#7c8480;--info:#79a7ec;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:4px 8px;font-size:12px}
/* login */
.login{max-width:360px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;display:grid;gap:12px}
.login label{display:grid;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.err{color:var(--accent);font-size:13px}
/* header */
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 16px;cursor:pointer;font-family:var(--f-disp);font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:260px 1fr;gap:18px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.list{display:grid;gap:4px}
.list button{text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:8px 10px;cursor:pointer;display:grid;gap:2px}
.list button.sel{background:var(--bg);border-color:var(--line)}
.list .code{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{width:100%}
td input.num{width:80px;text-align:right;font-family:var(--f-mono)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.p-ok{color:var(--ok)}.p-off{color:var(--off)}.p-run{color:var(--info)}.p-done{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.p-warn{color:var(--warn)}
.card{border:1px solid var(--line);border-left:4px solid var(--off);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface)}
.card.att{border-left-color:var(--ok)}.card.run{border-left-color:var(--info)}.card.done{opacity:.6}
.prio{display:grid;gap:2px}
.prio button{background:none;border:1px solid var(--line);border-radius:4px;width:26px;height:20px;cursor:pointer;font-size:10px;line-height:1}
.prionum{font-family:var(--f-mono);font-size:18px;font-weight:500;min-width:26px;text-align:center}
.stack{display:grid;gap:8px}
.diff-pos{color:var(--ok)}.diff-neg{color:var(--accent)}
.note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;margin-top:14px}
.gate{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.gate .date{font-family:var(--f-mono);font-size:13px}
@media(max-width:560px){.card{grid-template-columns:auto 1fr}.card .acts{grid-column:1/-1}.gate{grid-template-columns:1fr}}
</style>
<style>
/* Restyling: fondo con griglia tecnica, testata scura, superfici morbide */
:root{--bg:#eef0ec;--surface:#ffffff;--line:#dde1dc;--head:#1f2a26;--head-fg:#f1f4f0;--accent:#d2491d;--shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06)}

:root[data-theme="dark"]{--bg:#121614;--surface:#1b211e;--line:#2c3430;--head:#0c0f0e;--head-fg:#eef2ef;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
body{background-color:var(--bg);background-image:linear-gradient(color-mix(in srgb,var(--fg) 4%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--fg) 4%,transparent) 1px,transparent 1px);background-size:28px 28px}
header.top{background:var(--head);color:var(--head-fg);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:22px solid var(--accent);border-radius:50%;opacity:.35}
header.top h1{font-size:24px}
header.top .muted{color:color-mix(in srgb,var(--head-fg) 65%,transparent)}
header.top .btn{background:transparent;color:var(--head-fg);border-color:color-mix(in srgb,var(--head-fg) 35%,transparent);position:relative;z-index:1}
header.top>div{position:relative;z-index:1}
nav.tabs{border:0;background:var(--surface);border-radius:10px;padding:5px;gap:4px;box-shadow:var(--shadow);width:fit-content;max-width:100%}
nav.tabs button{border:0;border-radius:7px;margin:0;padding:9px 18px;transition:background .15s,color .15s}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.panel{border:0;border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.list button{border-radius:8px;transition:background .12s}
.list button:hover{background:var(--bg)}
.list button.sel{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.btn{border-radius:8px;transition:border-color .12s,transform .12s}
.btn.pri:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
input,select{border-radius:8px;background:var(--surface)}
td input,td select{border-color:transparent;background:transparent}
td input:hover,td select:hover{border-color:var(--line)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
th{border-bottom:2px solid var(--line)}
.pill{border:0;padding:3px 10px;background:color-mix(in srgb,currentColor 13%,transparent)}
.pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.card{border:0;border-left:5px solid var(--off);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateX(2px)}
.prionum{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--bg);font-size:15px;font-weight:600}
.card.att .prionum{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.card.run .prionum{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.prio button{border-radius:5px;background:var(--surface);color:var(--muted)}
.prio button:hover{color:var(--accent);border-color:var(--accent)}
.gate{border-bottom:0;padding:12px;border-radius:10px;margin-bottom:6px;background:var(--bg)}
.gate .date{background:var(--surface);border-radius:8px;padding:8px;text-align:center;font-weight:500;border-top:3px solid var(--accent)}
.login{border:0;border-radius:14px;box-shadow:var(--shadow);border-top:6px solid var(--accent);padding:32px}
.login h1{font-size:26px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* Stile Turni e Ferie: testata blu notte, tab nella banda scura, evidenza oro */
:root{--bg:#e8ebf1;--surface:#fbfcfe;--soft:#f1f3f8;--fg:#18213a;--muted:#5f6a80;--line:#d5dbe6;--ink:#15274f;--ink2:#22397a;--onink:#eef2fa;--onink2:#a9b6d3;--accent:#24529e;--accent-ink:#fff;--hi:#f2b33d;--ok:#18603f;--info:#1c4f94;--warn:#7d4c06;--shadow:0 1px 2px rgb(21 39 79/.08),0 8px 24px -8px rgb(21 39 79/.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d121d;--surface:#151c2b;--soft:#1a2234;--fg:#e4e9e5;--muted:#93a097;--line:#283248;--ink:#0f1c3b;--ink2:#15274f;--onink:#e6ecf8;--onink2:#8f9dbd;--accent:#7ea4ea;--accent-ink:#0d121d;--hi:#e0a63a;--ok:#9fd8bc;--info:#a9c8f2;--warn:#f1cf8b;--shadow:0 1px 2px rgb(0 0 0/.5)}}
:root[data-theme="dark"]{--bg:#0d121d;--surface:#151c2b;--soft:#1a2234;--fg:#e4e9e5;--muted:#93a097;--line:#283248;--ink:#0f1c3b;--ink2:#15274f;--onink:#e6ecf8;--onink2:#8f9dbd;--accent:#7ea4ea;--accent-ink:#0d121d;--hi:#e0a63a;--ok:#9fd8bc;--info:#a9c8f2;--warn:#f1cf8b;--shadow:0 1px 2px rgb(0 0 0/.5)}
body{background-image:none!important}
header.top{background:radial-gradient(120% 140% at 100% 0,var(--ink2),var(--ink)) var(--ink)!important;color:var(--onink);border-radius:18px 18px 0 0!important;margin-bottom:0!important;box-shadow:none!important}

.panel{border:1px solid var(--line)!important;border-radius:16px!important}
.list button.sel{background:var(--soft)!important;border-color:var(--accent)!important}

.crow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:center}
.cprio{font-family:var(--f-disp);font-weight:800;font-size:15px;color:var(--hi);text-align:center}
.prio button:disabled{opacity:.3;cursor:default}
.gate .date{border-top-color:var(--hi)!important}

.gate{background:var(--soft)!important}
/* menu sinistro */
aside.panel{background:var(--ink)!important;border:0!important;color:var(--onink)}
aside.panel h3{color:var(--onink);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--onink2)}
aside.panel .muted{color:var(--onink2)!important}

aside.panel input,aside.panel select{background:rgb(255 255 255/.07);border-color:rgb(255 255 255/.16);color:var(--onink)}
aside.panel select option{color:#15274f;background:#fff}

aside .list{gap:6px}

aside .list button:hover{background:rgb(255 255 255/.09)!important}
aside .list button.sel{background:var(--ink2)!important;border-color:var(--hi)!important;box-shadow:inset 3px 0 0 var(--hi)}
aside .list button:disabled{opacity:.4;cursor:default}
aside .list .code{color:var(--hi)}
.cn{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside .cprio{color:var(--hi)}
aside .prio button{background:transparent;border-color:rgb(255 255 255/.18);color:var(--onink2)}
.pg{display:flex;align-items:center;gap:8px;margin-top:4px}.pgb{flex:1;height:5px;border-radius:99px;background:rgb(255 255 255/.12);overflow:hidden}.pgb i{display:block;height:100%;background:var(--hi);border-radius:99px}.pgt{font-family:var(--f-mono);font-size:11px;color:var(--onink2)}
.pbtn{display:grid!important;grid-template-columns:36px minmax(0,1fr);gap:10px!important;align-items:center}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--soft);color:var(--accent);flex:none}

.irow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft)}

.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.gantt{display:grid;grid-auto-rows:38px;position:relative;min-width:max-content}
.gn{grid-column:1;position:sticky;left:0;z-index:2;background:var(--surface);padding:4px 10px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px;min-width:0}

.gd.td{box-shadow:inset 0 -3px 0 var(--hi)}.gd.td b{color:var(--hi)}
.gc{background:var(--ink);color:var(--onink);display:flex;align-items:center;gap:8px;padding:0 10px;font-family:var(--f-disp);font-weight:700;font-size:13px;position:sticky;left:0}
.gc .code{color:var(--hi);font-family:var(--f-mono);font-size:12px}
.gcell{border-bottom:1px solid var(--line)}.gcell.we{background:var(--soft)}
.gbar{align-self:center;height:18px;border-radius:6px;z-index:1;margin:0 2px}
.b-ok{background:var(--accent)}.b-off{background:repeating-linear-gradient(45deg,var(--muted) 0 4px,color-mix(in srgb,var(--muted) 60%,transparent) 4px 8px)}.b-run{background:var(--info);box-shadow:0 0 0 2px var(--hi)}.b-done{background:var(--ok);opacity:.7}
.gdia{align-self:center;justify-self:center;width:14px;height:14px;background:var(--hi);transform:rotate(45deg);z-index:1;border-radius:2px}
.gev .cn{color:var(--warn)}
:root{--gnw:220px;--gdw:30px}
.resp{margin-top:14px;padding:12px;border-radius:12px;background:var(--soft)}
.rh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px}
.rcell{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--accent)}.rcell select{width:100%}
.rrow2 input{width:100%}

 .gc{font-size:12px;white-space:nowrap}.gbar{height:14px;border-radius:4px}.gdia{width:11px;height:11px}
 .gwrap{margin-inline:-8px;border-radius:8px}section.panel:has(.gantt){padding:12px}
 section.panel:has(.gantt)>.row{flex-direction:column;align-items:stretch}section.panel:has(.gantt) select{width:100%}}
.mt td input:not(.num){min-width:180px}.mbar{position:relative;height:12px;background:var(--soft);border-radius:6px}.mbar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:6px}

.ggr .cn{font-weight:700;color:var(--accent)}.gsub{padding-left:22px!important}.gsum{align-self:center;height:8px;background:var(--fg);border-radius:2px;z-index:1;position:relative;margin:0 2px}
.gsum::before,.gsum::after{content:"";position:absolute;bottom:-5px;border:5px solid transparent;border-top-color:var(--fg)}.gsum::before{left:-2px}.gsum::after{right:-2px}
.grp{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.mt tr.sum td{background:var(--soft)}.mt tr.sum input[data-mf="nome"]{font-weight:700}.lv{font-family:var(--f-mono);font-size:10px;color:var(--muted);min-width:18px}

[data-gedit]{cursor:pointer}.gn[data-gedit]:hover .cn{color:var(--accent);text-decoration:underline}.gbar[data-gedit]:hover{filter:brightness(1.15)}

function render(){
 S.commesse.forEach(cCalc);
 if(!S.user){renderLogin();return}
 const isAdm=S.user.ruolo==='admin';
 const tabs=[['commesse','Commesse'],['persone','Persone'],['gantt','Gantt'],['ore','Ore'],['eventi','Eventi'],...(isAdm?[['master','Masterplan'],['imp','Impostazioni']]:[])];

 ({commesse:vCommesse,persone:vPersone,gantt:vGantt,master:vMaster,ore:vOre,eventi:vEventi,imp:vImp})[S.tab]();

 $('#app').innerHTML=`<form class="login" id="lf"><h1>Ergo Plan <span class="rev">v${VERSIONE}</span></h1>

 <label>Password<input id="p" type="password" autocomplete="current-password" value="admin"></label>
 <div class="err" id="le"></div><button class="btn pri">Accedi</button>
 <div class="muted" style="font-size:12px">Demo: admin / admin · marco / demo</div></form>`;
 $('#lf').onsubmit=e=>{e.preventDefault();const u=S.utenti[$('#u').value.trim()];
  if(u&&u.pw===$('#p').value){S.user=u;if(u.ruolo==='persona'){S.selP=u.nome;S.tab='persone'}render()}

}

async function importMaster(f){

 let rows=[];const D=v=>{if(v instanceof Date)return v;if(typeof v==='number')return new Date(Math.round((v-25569)*864e5));if(!v)return null;
  const s=String(v).trim(),it=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(it)return new Date(+(it[3].length===2?'20'+it[3]:it[3]),it[2]-1,+it[1]);const d=new Date(s);return isNaN(d)?null:d};

  [...x.getElementsByTagName('Task')].forEach(t=>{const g=n=>t.getElementsByTagName(n)[0]?.textContent;
   if(g('UID')==='0'||g('IsNull')==='1'||!g('Name'))return;
   const w=(g('Work')||'').match(/PT(\d+)H(\d+)M/);rows.push({liv:Math.max(0,(+g('OutlineLevel')||1)-1),sum:g('Summary')==='1',nome:g('Name'),s:D(g('Start')),e:D(g('Finish')),ore:w?+w[1]+(+w[2])/60:null})});
  if(!rows.length)throw new Error('Nessuna attività trovata nel file XML di Project.');
 }else{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});const a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true});
  const hi=a.findIndex(r=>r.some(c=>/attivit|task|nome|name|descriz/i.test(String(c??''))));if(hi<0)throw new Error('Non trovo la colonna delle attività (Attività, Nome o Task Name).');
  const h=a[hi].map(c=>String(c??'').toLowerCase()),col=re=>h.findIndex(c=>re.test(c));
  const cN=col(/attivit|task|nome|name|descriz/),cS=col(/inizio|start|dal/),cE=col(/fine|finish|end|al$/),cD=col(/durata|duration|gg|giorni/),cO=col(/ore|work|lavoro|budget/),cL=col(/livello|level|wbs|struttura/);
  a.slice(hi+1).forEach(r=>{const n=r[cN];if(!n)return;const s=cS>=0?D(r[cS]):null;let e=cE>=0?D(r[cE]):null;const du=cD>=0?parseFloat(String(r[cD]).replace(',','.')):NaN;
   if(s&&!e&&du>0)e=new Date(+s+(du-1)*864e5);rows.push({liv:cL>=0&&r[cL]!=null&&r[cL]!==''?(/\./.test(String(r[cL]))?String(r[cL]).split('.').length-1:Math.max(0,parseInt(r[cL])-1||0)):0,nome:String(n).trim(),s,e,du,ore:cO>=0&&r[cO]!==''&&r[cO]!=null?parseFloat(String(r[cO]).replace(',','.'))||null:null})});
  if(!rows.length)throw new Error('Nessuna attività trovata nel foglio.');}
 const dated=rows.filter(r=>r.s);const t0=dated.length?Math.min(...dated.map(r=>+r.s)):null;let cur=0;
 const att=rows.map(r=>{let off,dur;if(r.s&&t0!=null){off=Math.round((r.s-t0)/864e5);dur=r.e?Math.max(1,Math.round((r.e-r.s)/864e5)+1):(r.du>0?Math.round(r.du):1)}else{off=cur;dur=r.du>0?Math.round(r.du):5}

 const id=S.nextId++;S.master.push({id,nome:base,att});S.selM=id;render();
}

function mCalc(m){const A=m.att;A.forEach((a,i)=>{a.liv=Math.max(0,Math.min(+a.liv||0,i?A[i-1].liv+1:0));a.sum=false});
 for(let i=A.length-1;i>=0;i--){const a=A[i],ch=[];for(let j=i+1;j<A.length&&A[j].liv>a.liv;j++)if(A[j].liv===a.liv+1)ch.push(A[j]);
  if(ch.length){a.sum=true;a.off=Math.min(...ch.map(c=>c.off));a.dur=Math.max(...ch.map(c=>c.off+c.dur))-a.off;const o=ch.filter(c=>c.ore!=null);a.ore=o.length?o.reduce((s,c)=>s+c.ore,0):null}}return m}

</Tasks></Project>`}
